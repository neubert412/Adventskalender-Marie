<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adventskalender</title>
  <style>
    :root {
      --bg-dark: #10241c;
      --bg-card: #1b382c;
      --accent-red: #b8292f;
      --accent-red-hover: #d3343b;
      --accent-gold: #e5b85c;
      --text-light: #f7f4eb;
      --text-muted: #c5d1c9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1c4233 0%, var(--bg-dark) 75%);
      color: var(--text-light);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      max-width: 960px;
      margin: 0 auto 2rem;
      text-align: center;
    }

    header h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
      letter-spacing: 0.03em;
    }

    header p {
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    button {
      cursor: pointer;
      border: 1px solid rgba(229, 184, 92, 0.45);
      background: var(--bg-card);
      color: var(--text-light);
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: background 0.2s, transform 0.15s;
    }

    button:hover {
      background: #254d3c;
      transform: translateY(-1px);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 1rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .door {
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--accent-red), #8d1d22);
      border: 2px solid rgba(229, 184, 92, 0.55);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
    }

    .door:hover:not(.locked) {
      transform: translateY(-4px) scale(1.02);
      background: linear-gradient(145deg, var(--accent-red-hover), #a12228);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.45);
    }

    .door.opened {
      background: linear-gradient(145deg, #275240, #19362a);
      border-color: var(--accent-gold);
    }

    .door.locked {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(35%);
    }

    .door-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-gold);
      line-height: 1.1;
    }

    .door-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 2px solid var(--accent-gold);
      border-radius: 16px;
      max-width: 460px;
      width: 100%;
      padding: 1.75rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .modal h2 {
      color: var(--accent-gold);
      margin-bottom: 0.75rem;
      font-size: 1.5rem;
    }

    .modal .emoji {
      font-size: 3rem;
      margin-bottom: 0.75rem;
    }

    .modal p {
      line-height: 1.55;
      color: var(--text-light);
      margin-bottom: 1.5rem;
    }

    .modal .close-btn {
      background: var(--accent-red);
      border-color: var(--accent-gold);
      padding: 0.6rem 1.4rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
