<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adventskalender für Marie ♥️</title>
  <style>
    :root {
      --bg-dark: #10241c;
      --bg-card: #1b382c;
      --accent-red: #b8292f;
      --accent-red-hover: #d3343b;
      --accent-gold: #e5b85c;
      --text-light: #f7f4eb;
      --text-muted: #c5d1c9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1c4233 0%, var(--bg-dark) 75%);
      color: var(--text-light);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      max-width: 960px;
      margin: 0 auto 2rem;
      text-align: center;
    }

    header h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
      letter-spacing: 0.03em;
    }

    header p {
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    button {
      cursor: pointer;
      border: 1px solid rgba(229, 184, 92, 0.45);
      background: var(--bg-card);
      color: var(--text-light);
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: background 0.2s, transform 0.15s;
    }

    button:hover {
      background: #254d3c;
      transform: translateY(-1px);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 1rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .door {
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--accent-red), #8d1d22);
      border: 2px solid rgba(229, 184, 92, 0.55);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0.75rem;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
    }

    .door:hover:not(.locked) {
      transform: translateY(-4px) scale(1.02);
      background: linear-gradient(145deg, var(--accent-red-hover), #a12228);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.45);
    }

    .door.opened {
      background: linear-gradient(145deg, #275240, #19362a);
      border-color: var(--accent-gold);
    }

    .door.locked {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(35%);
    }

    .door-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-gold);
      line-height: 1.1;
    }

    .door-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 2px solid var(--accent-gold);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 1.75rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .modal h2 {
      color: var(--accent-gold);
      margin-bottom: 0.75rem;
      font-size: 1.5rem;
    }

    .modal .emoji {
      font-size: 3rem;
      margin-bottom: 0.75rem;
    }

    .modal img.door-image {
      display: none;
      max-width: 100%;
      max-height: 260px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      margin: 0 auto 1rem;
      border: 1px solid rgba(229, 184, 92, 0.4);
    }

    .modal img.door-image.visible {
      display: block;
    }

    .modal p {
      line-height: 1.55;
      color: var(--text-light);
      margin-bottom: 1.5rem;
    }

    .modal .close-btn {
      background: var(--accent-red);
      border-color: var(--accent-gold);
      padding: 0.6rem 1.4rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎄 Adventskalender für Marie ♥️</h1>
    <p id="subtitle">Jeden Tag ein neues Türchen bis Weihnachten</p>
    <div class="controls">
      <button id="toggleDateLockBtn" type="button">Datums-Sperre: AN</button>
      <button id="resetBtn" type="button">Türchen zurücksetzen</button>
    </div>
  </header>

  <main class="calendar-grid" id="calendarGrid"></main>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="emoji" id="modalEmoji">🎁</div>
      <img class="door-image" id="modalImage" alt="" />
      <h2 id="modalTitle">Türchen 1</h2>
      <p id="modalText">Inhalt</p>
      <button class="close-btn" id="closeModalBtn" type="button">Schließen</button>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // Bilder liegen direkt im Hauptordner neben index.html (z. B. Bild_1.jpg)
      const IMAGE_FOLDER = "";
      const IMAGE_PREFIX = "Bild_";
      const IMAGE_EXT = ".jpg";

      const doorsData = [
        { day: 1, emoji: "🤫", title: "Stille", text: "Manchmal merkt man erst wenn alles zur Ruhe kommt, was einem wirklich wichtig war." },
        { day: 2, emoji: "💭", title: "Vermissen", text: "Ich möchte dich einfach wissen lassen, dass du mir fehlst." },
        { day: 3, emoji: "📖", title: "Kein Ende", text: "Manche Geschichten fühlen sich so an als wären sie noch nicht fertig erzählt." },
        { day: 4, emoji: "❤️", title: "Mehr als Momente", text: "Ich vermisse nicht nur die schönen Momente, sondern vor allem dich. In all deinen Facetten." },
        { day: 5, emoji: "🌿", title: "Nachdenklich", text: "Ich habe in den letzten Wochen viel nachgedacht und war viel allein." },
        { day: 6, emoji: "⚖️", title: "Ehrliche Worte", text: "Es tut mir leid, wo ich nicht da war oder zu spät verstanden habe, was du gebraucht hast." },
        { day: 7, emoji: "✨", title: "Klarheit", text: "Aus Abstand wird manchmal Klarheit – und meine führt immer wieder zu dir." },
        { day: 8, emoji: "🌱", title: "Zeit", text: "Wenn ich könnte würde ich gerne die Zeit zurückdrehen und es besser machen." },
        { day: 9, emoji: "🔒", title: "Einfach richtig", text: "Zwischen all den Tagen merk ich immer wieder: Mit dir hat es sich einfach richtig angefühlt." },
        { day: 10, emoji: "💬", title: "Ruhe", text: "Du hast mir immer ein zu Hause gegeben. Egal wo wir waren. " },
        { day: 11, emoji: "🎯", title: "Kein Abschluss", text: "Du bist für mich kein Kapitel, das ich einfach zuklappen kann." },
        { day: 12, emoji: "🌟", title: "Loslassen", text: "Ich möchte aber einfach nur das du glücklich bist." },
        { day: 13, emoji: "❄️", title: "Gedanken an dich", text: "Oft bist du noch der erste Gedanke am Morgen und der letzte am Abend." },
        { day: 14, emoji: "🎶", title: "Gemeinsames", text: "Manche Dinge, Orte oder Kleinigkeiten erinnern mich immer wieder an dich." },
        { day: 15, emoji: "🧣", title: "Wärme", text: "Was uns verbunden hat, lässt sich nicht einfach wie einen Schalter abstellen." },
        { day: 16, emoji: "💌", title: "Nur für dich", text: "Egal was passiert, ich bin immer da für Dich." },
        { day: 17, emoji: "🧩", title: "Was zählt", text: "Erst wenn etwas fehlt, spürt man, wie viel Platz es im eigenen Leben hatte." },
        { day: 18, emoji: "🌲", title: "Raum für dich", text: "Mein Herz bleibt immer für dich offen." },
        { day: 19, emoji: "🎁", title: "Hoffnung", text: "Ich hoffe das wir uns niemals verlieren." },
        { day: 20, emoji: "✨", title: "Was ich schätze", text: "Ich schätze dein Lachen, deine Art und alles, was wir geteilt haben." },
        { day: 21, emoji: "🏔️", title: "Gesehen werden", text: "Es tut mir leid, dass ich die kleinen Dinge nicht gesehen habe" },
        { day: 22, emoji: "🔔", title: "Wertvoll", text: "Danke für alles, was du mir gegeben hast." },
        { day: 23, emoji: "❤️", title: "Herz", text: ".Mein Herz ist voll, wenn ich an unsere Zeit zurück denke."},
        { day: 24, emoji: "🎄", title: "Von Herzen", text: "Frohe Weihnachten ♥️. Egal wo wir stehen: Du bedeutest mir noch immer sehr viel." }
      ];

      const STORAGE_KEY = "adventskalender_opened_v1";
      let dateLockEnabled = true;

      const gridEl = document.getElementById("calendarGrid");
      const toggleLockBtn = document.getElementById("toggleDateLockBtn");
      const resetBtn = document.getElementById("resetBtn");
      const subtitleEl = document.getElementById("subtitle");

      const modalBackdrop = document.getElementById("modalBackdrop");
      const modalEmoji = document.getElementById("modalEmoji");
      const modalImage = document.getElementById("modalImage");
      const modalTitle = document.getElementById("modalTitle");
      const modalText = document.getElementById("modalText");
      const closeModalBtn = document.getElementById("closeModalBtn");

      if (!gridEl) return;

      function getImagePath(day) {
        return `${IMAGE_FOLDER}${IMAGE_PREFIX}${day}${IMAGE_EXT}`;
      }

      function getOpenedDays() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
          return [];
        }
      }

      function saveOpenedDays(days) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(days));
        } catch {}
      }

      function isDoorUnlocked(day) {
        if (!dateLockEnabled) return true;
        const now = new Date();
        const month = now.getMonth();
        const date = now.getDate();

        if (month < 11) return false;
        if (month > 11) return true;
        return date >= day;
      }

      function openModal(doorData) {
        modalEmoji.textContent = doorData.emoji;
        modalTitle.textContent = `Türchen ${doorData.day}: ${doorData.title}`;
        modalText.textContent = doorData.text;

        const imgPath = getImagePath(doorData.day);
        modalImage.classList.remove("visible");
        modalImage.alt = `Bild zu Türchen ${doorData.day}: ${doorData.title}`;
        modalImage.onload = () => {
          modalImage.classList.add("visible");
        };
        modalImage.onerror = () => {
          modalImage.classList.remove("visible");
        };
        modalImage.src = imgPath;

        modalBackdrop.classList.add("active");
      }

      function openLockedModal(day) {
        modalEmoji.textContent = "🔒";
        modalImage.classList.remove("visible");
        modalImage.removeAttribute("src");
        modalTitle.textContent = `Türchen ${day}`;
        modalText.textContent = `Dieses Türchen öffnet sich erst am ${day}. Dezember (oder wenn du oben die Datums-Sperre ausschaltest).`;
        modalBackdrop.classList.add("active");
      }

      function closeModal() {
        modalBackdrop.classList.remove("active");
      }

      function renderCalendar() {
        const openedDays = getOpenedDays();
        gridEl.innerHTML = "";

        subtitleEl.textContent = dateLockEnabled
          ? "Türchen lassen sich ab dem jeweiligen Dezembertag öffnen."
          : "Testmodus aktiv: Alle 24 Türchen können geöffnet werden.";

        doorsData.forEach((door) => {
          const unlocked = isDoorUnlocked(door.day);
          const isOpened = openedDays.includes(door.day);

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "door";
          if (isOpened) btn.classList.add("opened");
          if (!unlocked && !isOpened) btn.classList.add("locked");

          btn.innerHTML = `
            <span class="door-number">${door.day}</span>
            <span class="door-status">
              ${isOpened ? `${door.emoji} Geöffnet` : unlocked ? "Öffnen" : "Gesperrt"}
            </span>
          `;

          btn.addEventListener("click", () => {
            if (!unlocked && !isOpened) {
              openLockedModal(door.day);
              return;
            }

            if (!isOpened) {
              openedDays.push(door.day);
              saveOpenedDays(openedDays);
              renderCalendar();
            }
            openModal(door);
          });

          gridEl.appendChild(btn);
        });
      }

      toggleLockBtn.addEventListener("click", () => {
        dateLockEnabled = !dateLockEnabled;
        toggleLockBtn.textContent = `Datums-Sperre: ${dateLockEnabled ? "AN" : "AUS"}`;
        renderCalendar();
      });

      resetBtn.addEventListener("click", () => {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch {}
        renderCalendar();
      });

      closeModalBtn.addEventListener("click", closeModal);
      modalBackdrop.addEventListener("click", (e) => {
        if (e.target === modalBackdrop) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      renderCalendar();
    });
  </script>
</body>
</html>
